# ==================================================================
#  COSMIC LOCK · hyprlock 0.9 · diseño editorial alineado a la izquierda
#  El agujero negro respira arriba a la derecha; el contenido, a la izquierda.
# ==================================================================

$font      = Inter
$icons     = JetBrainsMono Nerd Font
$text      = rgba(234, 242, 255, 1.0)
$sub       = rgba(159, 176, 207, 1.0)
$accent    = rgba(140, 195, 255, 1.0)
$panel     = rgba(11, 18, 34, 1.0)
$info      = ~/.config/hypr/scripts/lock/info.sh

general {
    hide_cursor = true
    ignore_empty_input = true
    immediate_render = true
    fail_timeout = 1500
}

animations {
    enabled = true
    bezier = decel, 0.05, 0.7, 0.1, 1
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 6, decel
    animation = fadeOut, 1, 4, decel
    animation = inputFieldDots, 1, 3, decel
    animation = inputFieldColors, 1, 4, linear
    animation = inputFieldFade, 1, 5, decel
    animation = inputFieldWidth, 1, 4, decel
}

# ---------- Fondo: el agujero negro, algo desenfocado y oscurecido ----------
background {
    monitor =
    path = ~/.config/hypr/lock-bg.png
    blur_passes = 1
    blur_size = 2
    brightness = 0.58
    contrast = 1.05
    vibrancy = 0.2
    vibrancy_darkness = 0.1
    noise = 0.012
}

# ---------- Esquina superior: estado de sesión ----------
label {
    monitor =
    text = cmd[update:0] $info host
    color = $sub
    font_size = 12
    font_family = $font
    position = 120, -60
    halign = left
    valign = top
}

# ---------- Bloque principal (izquierda) ----------
# Fecha en versalitas con tracking
label {
    monitor =
    text = cmd[update:60000] echo "<span letter_spacing='3000'>$($info date)</span>"
    color = $accent
    font_size = 14
    font_family = $font
    position = 124, 230
    halign = left
    valign = center
}

# Reloj gigante: horas finas, dos puntos en acento, minutos finos
label {
    monitor =
    text = cmd[update:1000] echo "<span weight='200'>$(date +%H)</span><span weight='300' foreground='##8cc3ff'>:</span><span weight='200'>$(date +%M)</span>"
    color = $text
    font_size = 168
    font_family = $font
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(0, 0, 0, 0.6)
    position = 110, 110
    halign = left
    valign = center
}

# Saludo
label {
    monitor =
    text = cmd[update:60000] $info greeting
    color = $text
    font_size = 24
    font_family = $font
    position = 124, -20
    halign = left
    valign = center
}

# Avatar
image {
    monitor =
    path = ~/.config/hypr/lock-avatar.png
    size = 56
    rounding = -1
    border_size = 2
    border_color = rgba(140, 195, 255, 0.9) rgba(91, 108, 255, 0.9) 45deg
    position = 124, -120
    halign = left
    valign = center
}

# Campo de contraseña (sólido, píldora, borde degradado)
input-field {
    monitor =
    size = 380, 56
    outline_thickness = 2
    dots_size = 0.24
    dots_spacing = 0.4
    dots_center = false
    dots_rounding = -1
    rounding = -1
    outer_color = rgba(140, 195, 255, 0.55) rgba(91, 108, 255, 0.55) 45deg
    inner_color = $panel
    font_color = $text
    font_family = $font
    check_color = rgba(255, 212, 121, 0.95) rgba(255, 170, 90, 0.95) 45deg
    fail_color = rgba(255, 107, 139, 1.0) rgba(255, 80, 120, 1.0) 45deg
    capslock_color = rgba(255, 212, 121, 1.0)
    fade_on_empty = false
    placeholder_text = <span foreground="##64739a">Introduce tu contraseña</span>
    fail_text = <span foreground="##ff8ca5">Contraseña incorrecta  ·  intento $ATTEMPTS</span>
    position = 196, -120
    halign = left
    valign = center
}

# Pista bajo el campo
label {
    monitor =
    text = <span foreground="##64739a">Pulsa Intro para desbloquear  ·  Distribución </span><span foreground="##9fb0cf">$LAYOUT</span>
    color = $sub
    font_size = 11
    font_family = $font
    position = 200, -172
    halign = left
    valign = center
}

# ---------- Reproduciendo ahora ----------
label {
    monitor =
    text = cmd[update:2000] $info music
    color = $text
    font_size = 14
    font_family = $font
    position = 124, 150
    halign = left
    valign = bottom
}

# ---------- Barra de estado inferior (sólida) ----------
shape {
    monitor =
    size = 420, 48
    color = $panel
    rounding = -1
    border_size = 1
    border_color = rgba(255, 255, 255, 0.14)
    position = 110, 70
    halign = left
    valign = bottom
    zindex = 0
}
label {
    monitor =
    text = cmd[update:5000] $info status
    color = $text
    font_size = 13
    font_family = $font
    position = 134, 84
    halign = left
    valign = bottom
    zindex = 2
}

# Firma discreta abajo a la derecha
label {
    monitor =
    text = <span letter_spacing='4000'>EVENT HORIZON</span>
    color = rgba(159, 176, 207, 0.55)
    font_size = 10
    font_family = $font
    position = -60, 60
    halign = right
    valign = bottom
}
